<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Lost in space — Spacey Panda</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="theme-color" content="#04030a" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #04030a;
        --fg: #f6f5ff;
        --dim: #8b87b6;
        --accent: #f472d0;
        --cyan: #67e8f9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(
            ellipse 70% 55% at 50% 35%,
            rgba(232, 60, 188, 0.16) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 60% 50% at 80% 80%,
            rgba(34, 211, 238, 0.12) 0%,
            transparent 70%
          ),
          var(--bg);
        color: var(--fg);
        font-family:
          "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .code {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 13px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--cyan);
        margin: 0 0 20px;
      }
      h1 {
        font-family: "Space Grotesk", "Inter", ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(34px, 7vw, 62px);
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin: 0 0 18px;
      }
      .grad {
        background: linear-gradient(100deg, var(--accent), var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        max-width: 44ch;
        margin: 0 auto 34px;
        color: var(--dim);
        font-size: 17px;
        line-height: 1.6;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 26px;
        border-radius: 9999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        color: #150a17;
        background: linear-gradient(100deg, var(--accent), var(--cyan));
        transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      a.btn:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404 · Signal lost</p>
      <h1>This constellation <span class="grad">isn't mapped</span>.</h1>
      <p>
        The page you were looking for drifted out of orbit. Everything else —
        the catalogue, the links, the blog — is back on the home page.
      </p>
      <a class="btn" href="/">Back to Spacey Panda</a>
    </main>
  </body>
</html>
